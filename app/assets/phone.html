<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>PlayBridge</title>
<style>
:root{--bg:#05060d;--panel:rgba(18,22,40,.86);--ink:#eef1ff;--muted:#9aa3c7;--gold:#e8c46a;--blue:#5b7cff;--bad:#ff9d97;--key:rgba(255,255,255,.13);--key-on:rgba(232,196,106,.55);--rim:rgba(255,255,255,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--rim);border-radius:20px;padding:24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{font-size:22px;font-weight:600;margin:0 0 8px}
.card p{color:var(--muted);margin:0 0 18px}
.code{width:100%;font-size:32px;letter-spacing:10px;text-align:center;padding:12px;border-radius:14px;border:1px solid var(--rim);background:rgba(0,0,0,.35);color:var(--ink)}
.code:focus-visible,.primary:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.primary{margin-top:14px;width:100%;min-height:48px;border:0;border-radius:999px;background:linear-gradient(90deg,#4a63e0,#7b5cff);font-weight:600;cursor:pointer}
.primary:disabled{opacity:.5}
.note{margin-top:12px;min-height:1.4em;color:var(--muted)}
.note.bad{color:var(--bad)}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.bar{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:none;z-index:3}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{pointer-events:auto;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--rim);background:rgba(10,12,24,.65);color:var(--ink);font-size:14px;cursor:pointer}
.chip.status{cursor:default;color:var(--muted)}
.chip.status.good{color:var(--gold)}
.chip.status.bad{color:var(--bad)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:4;background:rgba(0,0,0,.45)}
#pad{position:absolute;inset:0;z-index:2;touch-action:none;user-select:none;-webkit-user-select:none}
.zone{position:absolute;bottom:0;width:42%;height:62%;touch-action:none}
.zone.left{left:0}.zone.right{right:0}
.stick{position:absolute;width:24vmin;height:24vmin;margin:-12vmin 0 0 -12vmin;border-radius:50%;border:2px solid var(--rim);background:var(--key);pointer-events:none;transition:opacity .15s}
.stick.rest{opacity:.85}
.stick i{position:absolute;left:50%;top:50%;width:11vmin;height:11vmin;margin:-5.5vmin 0 0 -5.5vmin;border-radius:50%;background:rgba(255,255,255,.28)}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1.5px solid var(--rim);background:var(--key);font-weight:600;touch-action:none;color:var(--ink);padding:0}
.btn.on{background:var(--key-on)}
.face{width:12vmin;height:12vmin;font-size:6vmin}
.dpad{width:10.5vmin;height:10.5vmin;border-radius:22%;font-size:5vmin}
.shoulder{width:17vmin;height:9vmin;border-radius:12px;font-size:4vmin}
.small{width:10vmin;height:7vmin;border-radius:10px;font-size:3.2vmin}
.hint{color:var(--muted);font-size:13px;margin-top:10px}
#safeArea{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.alert{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 48px);transform:translateX(-50%);z-index:5;width:max-content;max-width:min(520px,calc(100% - 32px));box-sizing:border-box;padding:10px 16px;border-radius:14px;border:1px solid var(--gold);background:var(--panel);box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none;overflow-wrap:anywhere}
.alert strong{display:block;color:var(--gold);font-size:15px}
.alert span{display:block;color:var(--ink);font-size:14px}
@media (max-height:380px),(max-width:380px){.chip{min-height:32px;padding:5px 10px;font-size:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="screen" id="pairing" hidden>
 <form class="card" id="pairForm" autocomplete="off">
  <h1>Pair this phone</h1>
  <p>On the PC, open PlayBridge › Settings › Phone and select <b>Pair a phone</b>. Enter the code it shows.</p>
  <label for="code" class="hint" style="display:block;margin:0 0 6px">Six-digit code</label>
  <input class="code" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
  <button class="primary" id="pairButton" type="submit">Pair</button>
  <div class="note" id="pairNote" role="status" aria-live="polite"></div>
 </form>
</section>

<section id="stage" hidden>
 <video id="video" playsinline muted disableremoteplayback></video>
 <div id="pad" aria-hidden="true"></div>
 <div id="safeArea" aria-hidden="true"></div>
 <div class="bar">
  <div class="chips">
   <span class="chip status" id="linkChip" role="status" aria-live="polite">Connecting…</span>
   <span class="chip status" id="padChip" role="status" aria-live="polite" hidden></span>
  </div>
  <div class="chips">
   <button class="chip" id="controlsButton" type="button" aria-pressed="true">Controls</button>
   <button class="chip" id="fullButton" type="button">Full screen</button>
   <button class="chip" id="leaveButton" type="button">Disconnect</button>
  </div>
 </div>
 <div class="alert" id="alertBox" role="alert" hidden><strong id="alertTitle"></strong><span id="alertText"></span></div>
 <div id="overlay">
  <div class="card">
   <h1 id="overlayTitle">Ready</h1>
   <p id="overlayText">Tap to start the picture and sound from your PS5.</p>
   <button class="primary" id="startButton" type="button">Start</button>
   <button class="primary" id="againButton" type="button" hidden>Connect again</button>
  </div>
 </div>
</section>

<script>
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get(){ try { return localStorage.getItem("pb_token") || ""; } catch (e) { return ""; } },
  set(v){ try { v ? localStorage.setItem("pb_token", v) : localStorage.removeItem("pb_token"); } catch (e) {} }
};
let token = store.get();

// ---- Pairing
function showPairing(message, bad){
  $("stage").hidden = true; $("pairing").hidden = false;
  $("pairNote").textContent = message || ""; $("pairNote").className = "note" + (bad ? " bad" : "");
  setTimeout(() => $("code").focus(), 50);
}
$("pairForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const code = $("code").value.trim();
  if (!/^\d{6}$/.test(code)) { $("pairNote").textContent = "Enter the six digits shown on the PC."; $("pairNote").className = "note bad"; return; }
  $("pairButton").disabled = true; $("pairNote").textContent = "Pairing…"; $("pairNote").className = "note";
  try {
    const r = await fetch("/api/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
    const body = await r.json().catch(() => ({}));
    if (r.ok && body.token) { token = body.token; store.set(token); $("code").value = ""; showStage(); return; }
    if (r.status === 403) showPairing(`That code is not right. ${body.left} ${body.left === 1 ? "try" : "tries"} left.`, true);
    else if (r.status === 429) showPairing("Too many wrong codes. Select Pair a phone on the PC for a new one.", true);
    else if (r.status === 410) showPairing("No code is showing on the PC, or it ran out. Select Pair a phone there.", true);
    else showPairing("The PC did not take that. Try again.", true);
  } catch (e) { showPairing("The PC did not answer. Check that this phone is on the same Wi-Fi.", true); }
  finally { $("pairButton").disabled = false; }
});

// ---- The picture: fragmented MP4 into Media Source (Managed Media Source on an iPhone), without sound
const video = $("video");
const Source = window.ManagedMediaSource || window.MediaSource;
let media = null, buffer = null, queue = [], expectInit = false, mime = "", started = false;
function resetMedia(type){
  mime = type; queue = []; buffer = null;
  if (!Source) { fail("This browser cannot play the stream. Try Chrome on Android or Safari on iPhone (iOS 17.1 or later)."); return; }
  if (!Source.isTypeSupported(type)) { fail("This browser cannot play this stream (" + type + ")."); return; }
  media = new Source();
  video.disableRemotePlayback = true;
  video.src = URL.createObjectURL(media);
  media.addEventListener("sourceopen", () => {
    try { buffer = media.addSourceBuffer(mime); buffer.mode = "segments"; buffer.addEventListener("updateend", pump); pump(); }
    catch (e) { fail("The stream could not start in this browser."); }
  }, { once: true });
}
function pump(){
  if (!buffer || buffer.updating || !queue.length) return;
  try { buffer.appendBuffer(queue.shift()); }
  catch (e) {
    // A full buffer: keep only the last seconds and carry on.
    if (e.name === "QuotaExceededError" && video.currentTime > 2) { try { buffer.remove(0, video.currentTime - 1); } catch (x) {} }
  }
}

// ---- The sound: plain samples from the PC, played a small store ahead on the phone's own clock
// Given the sound too, the browser's player waited longer each time the stream came late before it played on (0.6, then 1.2, then
// 2.5 s, measured here), and the picture stopped with it. Here each sound frame (21 ms) is played right after the one before, on whole
// samples: pieces that met half a sample apart, or were converted to the phone's rate one by one, clicked at every edge, and the
// PS5's own small time wobbles are not gaps (only more than 30 ms off is). A frame that comes too late is left out (a short silence;
// the picture carries on) and the store grows by 0.04 s, up to 0.4 s. It starts at 0.08 s; after 4 s with more in store than needed,
// one frame is left out to take back the extra: a quiet one when there is one within 3 s, else with the sound faded out and back in
// over 4 ms around it (playing faster for a moment changed the sound's pitch). Far more than needed all through a second (0.15 s
// over) is taken back at once the same way, a short skip rather than a delay that stays. After any silence it fades in, so there is
// no click.
const SAFE_LEAST = 0.05, SAFE_MOST = 0.4, SAFE_GROW = 0.04, SAFE_SHRINK = 0.01, SAFE_CALM = 10000, JOIN = 0.03, FADE = 0.004, QUIET = 100,
  FAR_EXTRA = 0.15;
let soundContext = null, snd = newSound();
function newSound(){
  const now = performance.now();
  return { offset: null, clockAt: null, next: null, gap: true, margin: 0.08, lateRun: false, lastLate: 0, minLead: Infinity, windowStart: now,
    shortLead: Infinity, shortStart: now, frame: 0.02, takeBack: 0, takeSince: 0, dropLeft: 0, lates: 0, lostMs: 0, trims: 0, resyncs: 0 };
}
// The sound needs a tap before a browser plays it. At the stream's own rate (the PS5's 48 kHz), so the phone converts the whole sound
// once rather than each piece; "balanced" gives a busy phone's sound a little more room than the smallest setting.
function startSound(){
  const Context = window.AudioContext || window.webkitAudioContext; if (!Context) return;
  if (!soundContext) {
    for (const options of [{ sampleRate: 48000, latencyHint: "balanced" }, { latencyHint: "balanced" }, null]) {
      try { soundContext = options ? new Context(options) : new Context(); break; } catch (e) { soundContext = null; }
    }
  }
  if (soundContext) soundContext.resume().catch(() => {});
}
// The stream's time now heard from the speaker, or null while there is no sound.
function heardNow(){
  const c = soundContext;
  if (!c || snd.offset === null || c.state !== "running") return null;
  let t = c.currentTime - (c.outputLatency || c.baseLatency || 0);
  if (c.getOutputTimestamp) { const o = c.getOutputTimestamp(); if (o.contextTime > 0 && o.performanceTime > 0) t = o.contextTime + (performance.now() - o.performanceTime) / 1000; }
  return t - snd.offset;
}
// One message from the PC: "PBAU", its time (double), the sample rate (uint32), the channels (uint16), then 16-bit samples.
function isSound(data){ const b = new Uint8Array(data, 0, Math.min(4, data.byteLength)); return b.length === 4 && b[0] === 80 && b[1] === 66 && b[2] === 65 && b[3] === 85; }
function playSound(data){
  const c = soundContext; if (!c || c.state !== "running" || data.byteLength < 18) return;
  const head = new DataView(data), at = head.getFloat64(4, true), rate = head.getUint32(12, true), channels = head.getUint16(16, true);
  if (!rate || !channels) return;
  const samples = new Int16Array(data, 18, (data.byteLength - 18) >> 1), n = Math.floor(samples.length / channels);
  if (!n) return;
  const fs = c.sampleRate, length = n / rate, now = c.currentTime, s = snd;
  if (s.offset === null) {
    // Only once the phone's sound clock runs: while its output starts (a quarter of a second measured here) the clock stands still,
    // and all the sound sent meanwhile stayed as extra delay.
    if (s.clockAt === null || now === s.clockAt) { s.clockAt = now; return; }
    s.offset = now + s.margin - at; s.gap = true;
  }
  let when = at + s.offset;
  if (s.next !== null && !s.gap) {
    const drift = when - s.next;
    // Already played (the PS5 sent this stretch twice): left out. A little off: right after the last one. Far off: a real gap.
    if (drift < -JOIN) { s.resyncs++; return; }
    if (drift <= JOIN) { when = s.next; s.offset = when - at; } else { s.resyncs++; s.gap = true; }
  }
  when = Math.round(when * fs) / fs;
  let lead = when - now;
  // Far ahead: the stream's clock started again; play from here.
  if (lead > s.margin + 1) { s.offset = now + s.margin - at; when = Math.round((at + s.offset) * fs) / fs; lead = when - now; s.gap = true; s.resyncs++; }
  if (lead < 0.004) {
    // Too late to play: left out, and once for each hiccup the store grows (a short silence more now, fewer later).
    if (!s.lateRun) { s.lateRun = true; s.lates++; s.margin = Math.min(SAFE_MOST, s.margin + SAFE_GROW); s.offset += SAFE_GROW; }
    s.lostMs += length * 1000; s.lastLate = performance.now(); s.gap = true; return;
  }
  s.lateRun = false; s.minLead = Math.min(s.minLead, lead); s.shortLead = Math.min(s.shortLead, lead); s.frame = length;
  // Taking back extra store: the frames after one that faded out are left out (the next fades in), or one quiet frame at a time.
  let loudest = 0; for (let i = 0; i < samples.length; i++) { const v = samples[i] < 0 ? -samples[i] : samples[i]; if (v > loudest) loudest = v; }
  if (s.dropLeft > 0) { s.dropLeft--; s.offset -= length; s.trims++; s.gap = true; return; }
  if (s.takeBack > 0 && loudest < QUIET) { s.takeBack--; s.offset -= length; s.trims++; return; }
  // No quiet frame within 3 s, or much to take back: this one fades out over its last 4 ms and the rest is left out after it.
  const fadeOut = s.takeBack > 0 && !s.gap && (s.takeBack > 1 || performance.now() - s.takeSince > 3000);
  const out = c.createBuffer(channels, n, rate);
  for (let k = 0; k < channels; k++) { const plane = out.getChannelData(k); for (let i = 0; i < n; i++) plane[i] = samples[i * channels + k] / 32768; }
  const source = c.createBufferSource(); source.buffer = out;
  if (s.gap || fadeOut) {
    const fade = c.createGain();
    if (s.gap) { fade.gain.setValueAtTime(0, when); fade.gain.linearRampToValueAtTime(1, when + FADE); } else fade.gain.setValueAtTime(1, when);
    if (fadeOut) { fade.gain.setValueAtTime(1, when + length - FADE); fade.gain.linearRampToValueAtTime(0, when + length); s.dropLeft = s.takeBack; s.takeBack = 0; }
    source.connect(fade); fade.connect(c.destination); s.gap = false;
  } else source.connect(c.destination);
  source.start(when); s.next = when + length;
}
setInterval(() => {
  const s = snd, now = performance.now();
  if (s.offset === null) return;
  // Far more in store than needed all through the last second: all but a frame of the extra is taken back at once.
  if (now - s.shortStart >= 1000) {
    const extra = s.shortLead - s.margin;
    if (s.shortLead !== Infinity && extra > FAR_EXTRA && now - s.lastLate > 1000 && !s.takeBack && !s.dropLeft) {
      s.takeBack = Math.floor((extra - 0.02) / s.frame); s.takeSince = now; s.minLead = Infinity; s.windowStart = now;
    }
    s.shortLead = Infinity; s.shortStart = now;
  }
  if (now - s.windowStart < 4000) return;
  if (now - s.lastLate > SAFE_CALM) s.margin = Math.max(SAFE_LEAST, s.margin - SAFE_SHRINK);
  // More in store than the store needs all through these 4 s (by over a frame and a half): one frame is taken back.
  if (s.minLead !== Infinity && now - s.lastLate > 4000 && s.minLead - s.margin > 0.035 && !s.takeBack && !s.dropLeft) { s.takeBack = 1; s.takeSince = now; }
  s.minLead = Infinity; s.windowStart = now;
}, 500);
// What the phone's sound output says of itself, for the phone log: its rate, its delay, and (where the browser counts them) the times
// it ran out of sound to play.
function soundOutput(){
  const c = soundContext; if (!c) return { rate: 0, out_ms: 0, underruns: -1 };
  const stats = c.playbackStats, underruns = stats && typeof stats.underrunEvents === "number" ? stats.underrunEvents : -1;
  return { rate: c.sampleRate, out_ms: Math.round((c.outputLatency || c.baseLatency || 0) * 1000), underruns };
}

// ---- The picture: as soon as it plays smoothly. A game answers the controller on the screen, so the picture no longer waits for
// the sound (that kept it 0.13-0.24 s behind on a phone): each has its own small store, as game streaming apps do, and the sound
// comes a few hundredths of a second after the picture. The picture's store starts at 0.06 s behind the newest picture. Every 2 s,
// what was in hand at the worst moment shows how much of it was needed: half of what was spare goes back, and a store that ran
// nearly dry grows by what it lacked. A stall longer than 25 ms adds what it lasted (0.02-0.1 s) and the store stays above the level
// it stalled at for a while (some phones hold a few pictures back in their decoder, so a store can stall before it runs dry). Behind,
// the picture catches up by playing 10% faster (25% when over 0.2 s behind); ahead, it waits by playing 10% slower; only more than a
// second off (back from another app, say) it jumps.
const PIC_START = 0.06, PIC_LEAST = 0.035, PIC_MOST = 0.35, PIC_SPARE = 0.015, PIC_FLOOR_DROP = 0.002, NEAR = 0.03, CLOSE = 0.01, FAR = 0.2, OFF = 1;
let fast = 0, pic = newPicture();
function newPicture(){
  const now = performance.now();
  return { aim: PIC_START, floor: PIC_LEAST, minAhead: Infinity, windowStart: now, stalledIn: false };
}
function pictureStalled(ms){
  if (ms < 25) return;
  pic.floor = Math.min(PIC_MOST, Math.max(pic.floor, pic.aim + 0.01));
  pic.aim = Math.min(PIC_MOST, Math.max(pic.floor, pic.aim + Math.min(0.1, Math.max(0.02, ms / 1000)))); pic.stalledIn = true;
}
setInterval(() => {
  if (!buffer || !buffer.buffered.length || buffer.updating) return;
  const last = buffer.buffered.length - 1, end = buffer.buffered.end(last), start = buffer.buffered.start(last), now = performance.now();
  if (started && !video.paused) pic.minAhead = Math.min(pic.minAhead, end - video.currentTime);
  if (now - pic.windowStart >= 2000) {
    if (pic.minAhead !== Infinity) {
      const spare = pic.minAhead - PIC_SPARE;
      if (spare < 0) pic.aim = Math.min(PIC_MOST, pic.aim - spare);
      else if (!pic.stalledIn) pic.aim = Math.max(pic.floor, pic.aim - spare / 2);
    }
    if (!pic.stalledIn) pic.floor = Math.max(PIC_LEAST, pic.floor - PIC_FLOOR_DROP);
    pic.minAhead = Infinity; pic.windowStart = now; pic.stalledIn = false;
  }
  const target = Math.max(start, end - pic.aim), behind = target - video.currentTime;
  if (video.currentTime < start || Math.abs(behind) > OFF) { video.currentTime = target; fast = 0; }
  else if (behind > FAR) fast = 2;
  else if (fast === 2 && behind < FAR / 2) fast = 1;
  else if (fast <= 0 && behind > NEAR) fast = 1;
  else if (fast >= 0 && behind < -NEAR) fast = -1;
  else if ((fast > 0 && behind < CLOSE) || (fast === -1 && behind > -CLOSE)) fast = 0;
  const rate = fast === 2 ? 1.25 : fast === 1 ? 1.1 : fast === -1 ? 0.9 : 1;
  if (video.playbackRate !== rate) video.playbackRate = rate;
  if (started && !leaving && video.paused) video.play().catch(() => {});
  if (video.currentTime - buffer.buffered.start(0) > 30) { try { buffer.remove(0, video.currentTime - 10); } catch (e) {} }
}, 50);

// ---- The link to the PC
let socket = null, retry = null, leaving = false;
// Disconnected, by this phone or from the PC: no picture, no controller on the PS5, and no new try until asked.
function showLeft(text){
  leaving = true; clearTimeout(retry); video.pause(); queue = []; $("pad").hidden = true; $("padChip").hidden = true; $("leaveButton").hidden = true; setLink("Disconnected");
  $("overlayTitle").textContent = "Disconnected"; $("overlayText").textContent = text;
  $("startButton").hidden = true; $("againButton").hidden = false; $("overlay").hidden = false;
  setTimeout(() => $("againButton").focus(), 50);
}
function leave(){
  leaving = true;
  if (socket && socket.readyState <= 1) socket.close(1000);
  showLeft("This phone left PlayBridge. Its controller is off your PS5.");
}
function connectAgain(){
  leaving = false; $("againButton").hidden = true; $("startButton").hidden = false; $("leaveButton").hidden = false;
  $("overlayTitle").textContent = "Ready"; $("overlayText").textContent = "Tap to start the picture and sound from your PS5.";
  $("overlay").hidden = started;
  if (started) { startSound(); video.play().catch(() => {}); } else setTimeout(() => $("startButton").focus(), 50);
  connect();
}
function setLink(text, tone){ const c = $("linkChip"); c.textContent = text; c.className = "chip status" + (tone ? " " + tone : ""); layout(); }
function connect(){
  clearTimeout(retry);
  socket = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  socket.binaryType = "arraybuffer";
  setLink("Connecting…");
  socket.onopen = () => { socket.send(JSON.stringify({ token })); setLink("Waiting for the picture…"); };
  socket.onmessage = ev => {
    if (typeof ev.data === "string") {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === "init") { expectInit = true; mime = m.mime; }
      else if (m.type === "hello" || m.type === "pad") showPad(m);
      else if (m.type === "alert") showAlert(m);
      return;
    }
    if (isSound(ev.data)) { if (!expectInit) playSound(ev.data); return; }

// Alert me when, from the PC: shown over the game for a few seconds, with the phone vibrating where it can.
let alertTimer = null;

// Every 2 s while it plays, how it plays, for the phone log on the PC: the picture's stalls and how long they lasted, its jumps, how

    const out = soundOutput(), behind = held.length ? held.end(held.length - 1) - video.currentTime : 0;

const keys = {}, zones = {};

const homes = {}, rings = {}, held = new Set();
function button(name, label, bit, cls, aria){

function stickRadius(){ return Math.min(innerWidth, innerHeight) * 0.12; }
// Each stick shows where it rests, as on a controller. A thumb put on it moves it from its own centre, as a real stick; put anywhere else

function stick(side, first){

  const ring = document.createElement("div"); ring.className = "stick rest"; ring.hidden = true; ring.innerHTML = "<i></i>"; zone.appendChild(ring); rings[side] = ring;

function buildPad(){
  stick("left", 0); stick("right", 2);
  button("L2", "L2", B.L2, "shoulder"); button("L1", "L1", B.L1, "shoulder"); button("R2", "R2", B.R2, "shoulder"); button("R1", "R1", B.R1, "shoulder");

// Every control gets its own place, worked out from the space the browser really gives (its bars and a notch take some), so no button

function area(el, x, y, w, h){ el.style.left = Math.round(x) + "px"; el.style.top = Math.round(y) + "px"; el.style.width = Math.round(w) + "px"; el.style.height = Math.round(h) + "px"; el.style.bottom = "auto"; }
