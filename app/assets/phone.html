<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>PlayBridge</title>
<style>
:root{--bg:#05060d;--panel:rgba(18,22,40,.86);--ink:#eef1ff;--muted:#9aa3c7;--gold:#e8c46a;--blue:#5b7cff;--bad:#ff9d97;--key:rgba(255,255,255,.13);--key-on:rgba(232,196,106,.55);--rim:rgba(255,255,255,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--rim);border-radius:20px;padding:24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{font-size:22px;font-weight:600;margin:0 0 8px}
.card p{color:var(--muted);margin:0 0 18px}
.code{width:100%;font-size:32px;letter-spacing:10px;text-align:center;padding:12px;border-radius:14px;border:1px solid var(--rim);background:rgba(0,0,0,.35);color:var(--ink)}
.code:focus-visible,.primary:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.primary{margin-top:14px;width:100%;min-height:48px;border:0;border-radius:999px;background:linear-gradient(90deg,#4a63e0,#7b5cff);font-weight:600;cursor:pointer}
.primary:disabled{opacity:.5}
.note{margin-top:12px;min-height:1.4em;color:var(--muted)}
.note.bad{color:var(--bad)}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.bar{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:none;z-index:3}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{pointer-events:auto;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--rim);background:rgba(10,12,24,.65);color:var(--ink);font-size:14px;cursor:pointer}
.chip.status{cursor:default;color:var(--muted)}
.chip.status.good{color:var(--gold)}
.chip.status.bad{color:var(--bad)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:4;background:rgba(0,0,0,.45)}
#pad{position:absolute;inset:0;z-index:2;touch-action:none;user-select:none;-webkit-user-select:none}
.zone{position:absolute;bottom:0;width:42%;height:62%;touch-action:none}
.zone.left{left:0}.zone.right{right:0}
.stick{position:absolute;width:24vmin;height:24vmin;margin:-12vmin 0 0 -12vmin;border-radius:50%;border:2px solid var(--rim);background:var(--key);pointer-events:none;transition:opacity .15s}
.stick.rest{opacity:.85}
.stick i{position:absolute;left:50%;top:50%;width:11vmin;height:11vmin;margin:-5.5vmin 0 0 -5.5vmin;border-radius:50%;background:rgba(255,255,255,.28)}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1.5px solid var(--rim);background:var(--key);font-weight:600;touch-action:none;color:var(--ink);padding:0}
.btn.on{background:var(--key-on)}
.face{width:12vmin;height:12vmin;font-size:6vmin}
.dpad{width:10.5vmin;height:10.5vmin;border-radius:22%;font-size:5vmin}
.shoulder{width:17vmin;height:9vmin;border-radius:12px;font-size:4vmin}
.small{width:10vmin;height:7vmin;border-radius:10px;font-size:3.2vmin}
.hint{color:var(--muted);font-size:13px;margin-top:10px}
#safeArea{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.alert{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 48px);transform:translateX(-50%);z-index:5;width:max-content;max-width:min(520px,calc(100% - 32px));box-sizing:border-box;padding:10px 16px;border-radius:14px;border:1px solid var(--gold);background:var(--panel);box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none;overflow-wrap:anywhere}
.alert strong{display:block;color:var(--gold);font-size:15px}
.alert span{display:block;color:var(--ink);font-size:14px}
@media (max-height:380px),(max-width:380px){.chip{min-height:32px;padding:5px 10px;font-size:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* A big screen (a TV, a Steam Deck, a PC browser): read from a sofa and moved through with a remote or a controller. */
.big .card{width:min(680px,100%);padding:40px;border-radius:28px}
.big .card h1{font-size:34px}
.big .card p,.big .note{font-size:21px}
.big .hint{font-size:18px}
.big .code{font-size:52px;letter-spacing:16px}
.big .primary{min-height:68px;font-size:24px}
.big .chip{min-height:52px;padding:10px 22px;font-size:20px}
.big :focus-visible,.big .chip:focus{outline:4px solid var(--gold);outline-offset:3px}
.big .bar{transition:opacity .2s}
.big .bar.away{opacity:0;pointer-events:none}
.keys{margin:16px 0 0;color:var(--muted);font-size:18px;line-height:1.6}
/* More: games, captures and the log, in a sheet over the picture. */
.sheet{position:absolute;inset:0;z-index:6;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left))}
.sheet .panel{width:min(760px,100%);height:100%;max-height:min(100%,640px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--rim);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5);padding:12px 14px max(12px,env(safe-area-inset-bottom));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.sheet header{display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto}
.tab{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--rim);background:transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{border-color:var(--gold);color:var(--gold);background:rgba(232,196,106,.12)}
.tab:focus-visible,.game:focus-visible,.shot:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sheet .note{margin:8px 2px 0;min-height:1.4em;font-size:14px}
.ask{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding:10px 12px;border:1px solid var(--gold);border-radius:14px;background:rgba(232,196,106,.08)}
.ask span{flex:1 1 220px}
.chip.gold{border-color:var(--gold);color:var(--gold)}
a.chip{display:inline-flex;align-items:center;text-decoration:none}
.list{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin-top:10px;padding:2px}
.list.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;align-content:start}
.list.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start}
.game,.shot{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:14px;border:1px solid transparent;background:rgba(255,255,255,.05);cursor:pointer;text-align:left;min-width:0}
.game img{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;background:rgba(255,255,255,.08)}
.shot img{width:100%;aspect-ratio:16/9;border-radius:10px;object-fit:cover;background:rgba(255,255,255,.08)}
.game.on{border-color:var(--gold)}
.game .name{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.game .open,.shot .badge{font-size:12px;color:var(--gold)}
.shot .when{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.list.log{margin-top:10px;font:12px/1.55 ui-monospace,"Cascadia Mono",Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);background:rgba(0,0,0,.3);border-radius:12px;padding:10px}
.viewer{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:rgba(0,0,0,.94)}
.viewer .body{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.viewer img,.viewer video{position:static;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.viewer .name{color:var(--muted);font-size:13px;overflow-wrap:anywhere;text-align:center}
.big .tab{min-height:52px;font-size:20px;padding:10px 22px}
.big .game .name{font-size:17px}
.big .list.games{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.big .list.shots{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.big .tab:focus-visible,.big .game:focus,.big .shot:focus{outline:4px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<section class="screen" id="pairing" hidden>
 <form class="card" id="pairForm" autocomplete="off">
  <h1 id="pairTitle">Pair this phone</h1>
  <p>On the PC, open PlayBridge › Settings › Phone and select <b>Pair a phone</b>. Enter the code it shows.</p>
  <label for="code" class="hint" style="display:block;margin:0 0 6px">Six-digit code</label>
  <input class="code" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
  <button class="primary" id="pairButton" type="submit">Pair</button>
  <div class="note" id="pairNote" role="status" aria-live="polite"></div>
 </form>
</section>

<section id="stage" hidden>
 <video id="video" playsinline muted disableremoteplayback></video>
 <div id="pad" aria-hidden="true"></div>
 <div id="safeArea" aria-hidden="true"></div>
 <div class="bar">
  <div class="chips">
   <span class="chip status" id="linkChip" role="status" aria-live="polite">Connecting…</span>
   <span class="chip status" id="padChip" role="status" aria-live="polite" hidden></span>
  </div>
  <div class="chips">
   <button class="chip" id="moreButton" type="button" aria-haspopup="dialog">More</button>
   <button class="chip" id="controlsButton" type="button" aria-pressed="true">Controls</button>
   <button class="chip" id="fullButton" type="button">Full screen</button>
   <button class="chip" id="leaveButton" type="button">Disconnect</button>
  </div>
 </div>
 <div class="alert" id="alertBox" role="alert" hidden><strong id="alertTitle"></strong><span id="alertText"></span></div>
 <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="More" hidden>
  <div class="panel">
   <header>
    <div class="tabs" role="tablist">
     <button class="tab" role="tab" id="tabGames" type="button" aria-selected="true" aria-controls="sheetList">Games</button>
     <button class="tab" role="tab" id="tabShots" type="button" aria-selected="false" aria-controls="sheetList">Captures</button>
     <button class="tab" role="tab" id="tabLog" type="button" aria-selected="false" aria-controls="sheetList">Log</button>
    </div>
    <button class="chip" id="sheetClose" type="button">Close</button>
   </header>
   <div class="ask" id="sheetAsk" hidden><span id="askText"></span><button class="chip gold" id="askYes" type="button">Switch games</button><button class="chip" id="askNo" type="button">Cancel</button></div>
   <div class="note" id="sheetNote" role="status" aria-live="polite"></div>
   <div class="list" id="sheetList" role="tabpanel"></div>
  </div>
 </div>
 <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Capture" hidden>
  <div class="body" id="viewerBody"></div>
  <div class="name" id="viewerName"></div>
  <div class="chips"><a class="chip gold" id="viewerSave" href="#">Save to this phone</a><button class="chip" id="viewerClose" type="button">Close</button></div>
 </div>
 <div id="overlay">
  <div class="card">
   <h1 id="overlayTitle">Ready</h1>
   <p id="overlayText">Tap to start the picture and sound from your PS5.</p>
   <p class="keys" id="keysHelp" hidden></p>
   <button class="primary" id="startButton" type="button">Start</button>
   <button class="primary" id="againButton" type="button" hidden>Connect again</button>
  </div>
 </div>
</section>

<script>
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get(){ try { return localStorage.getItem("pb_token") || ""; } catch (e) { return ""; } },
  set(v){ try { v ? localStorage.setItem("pb_token", v) : localStorage.removeItem("pb_token"); } catch (e) {} }
};
let token = store.get();

// ---- Big screen: a TV, a Steam Deck or a PC browser, played with a controller, a TV remote or a keyboard rather than touch. /tv asks
// for it; a browser with no touch screen gets it too.
const big = location.pathname === "/tv" || new URLSearchParams(location.search).has("tv") || (!("ontouchstart" in window) && !matchMedia("(pointer: coarse)").matches);
if (big) {
  document.documentElement.classList.add("big");
  $("pairTitle").textContent = "Pair this screen";
  $("overlayText").textContent = "Press OK or ✕ to start the picture and sound from your PS5.";
}

// ---- Pairing
// The QR code in PlayBridge's Settings carries the pairing code after #: it is read once and taken out of the address bar.
const scanned = (location.hash.match(/[#&]code=(\d{6})(?:&|$)/) || [])[1] || "";
if (location.hash) history.replaceState(null, "", location.pathname + location.search);
function showPairing(message, bad){
  $("stage").hidden = true; $("pairing").hidden = false;
  $("pairNote").textContent = message || ""; $("pairNote").className = "note" + (bad ? " bad" : "");
  setTimeout(() => $("code").focus(), 50);
}
$("pairForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const code = $("code").value.trim();
  if (!/^\d{6}$/.test(code)) { $("pairNote").textContent = "Enter the six digits shown on the PC."; $("pairNote").className = "note bad"; return; }
  $("pairButton").disabled = true; $("pairNote").textContent = "Pairing…"; $("pairNote").className = "note";
  try {
    const r = await fetch("/api/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
    const body = await r.json().catch(() => ({}));
    if (r.ok && body.token) { token = body.token; store.set(token); $("code").value = ""; showStage(); return; }
    if (r.status === 403) showPairing(`That code is not right. ${body.left} ${body.left === 1 ? "try" : "tries"} left.`, true);
    else if (r.status === 429) showPairing("Too many wrong codes. Select Pair a phone on the PC for a new one.", true);
    else if (r.status === 410) showPairing("No code is showing on the PC, or it ran out. Select Pair a phone there.", true);
    else showPairing("The PC did not take that. Try again.", true);
  } catch (e) { showPairing("The PC did not answer. Check that this phone is on the same Wi-Fi.", true); }
  finally { $("pairButton").disabled = false; }
});

// ---- The picture: fragmented MP4 into Media Source (Managed Media Source on an iPhone), without sound
const video = $("video");
const Source = window.ManagedMediaSource || window.MediaSource;
let media = null, buffer = null, queue = [], expectInit = false, mime = "", started = false;
function resetMedia(type){
  mime = type; queue = []; buffer = null;
  if (!Source) { fail("This browser cannot play the stream. Try Chrome on Android or Safari on iPhone (iOS 17.1 or later)."); return; }
  if (!Source.isTypeSupported(type)) { fail("This browser cannot play this stream (" + type + ")."); return; }
  media = new Source();
  video.disableRemotePlayback = true;
  video.src = URL.createObjectURL(media);
  media.addEventListener("sourceopen", () => {
    try { buffer = media.addSourceBuffer(mime); buffer.mode = "segments"; buffer.addEventListener("updateend", pump); pump(); }
    catch (e) { fail("The stream could not start in this browser."); }
  }, { once: true });
}
function pump(){
  if (!buffer || buffer.updating || !queue.length) return;
  try { buffer.appendBuffer(queue.shift()); }
  catch (e) {
    // A full buffer: keep only the last seconds and carry on.
    if (e.name === "QuotaExceededError" && video.currentTime > 2) { try { buffer.remove(0, video.currentTime - 1); } catch (x) {} }
  }
}

// ---- The sound: plain samples from the PC, played a small store ahead on the phone's own clock
// Given the sound too, the browser's player waited longer each time the stream came late before it played on (0.6, then 1.2, then
// 2.5 s, measured here), and the picture stopped with it. Here each sound frame (21 ms) is played right after the one before, on whole
// samples: pieces that met half a sample apart, or were converted to the phone's rate one by one, clicked at every edge, and the
// PS5's own small time wobbles are not gaps (only more than 30 ms off is). A frame that comes too late is left out (a short silence;
// the picture carries on) and the store grows by 0.04 s, up to 0.4 s. It starts at 0.08 s; after 4 s with more in store than needed,
// one frame is left out to take back the extra: a quiet one when there is one within 3 s, else with the sound faded out and back in
// over 4 ms around it (playing faster for a moment changed the sound's pitch). Far more than needed all through a second (0.15 s
// over) is taken back at once the same way, a short skip rather than a delay that stays. After any silence it fades in, so there is
// no click.
const SAFE_LEAST = 0.05, SAFE_MOST = 0.4, SAFE_GROW = 0.04, SAFE_SHRINK = 0.01, SAFE_CALM = 10000, JOIN = 0.03, FADE = 0.004, QUIET = 100,
  FAR_EXTRA = 0.15;
let soundContext = null, snd = newSound();
function newSound(){
  const now = performance.now();
  return { offset: null, clockAt: null, next: null, gap: true, margin: 0.08, lateRun: false, lastLate: 0, minLead: Infinity, windowStart: now,
    shortLead: Infinity, shortStart: now, frame: 0.02, takeBack: 0, takeSince: 0, dropLeft: 0, lates: 0, lostMs: 0, trims: 0, resyncs: 0 };
}
// The sound needs a tap before a browser plays it. At the stream's own rate (the PS5's 48 kHz), so the phone converts the whole sound
// once rather than each piece; "balanced" gives a busy phone's sound a little more room than the smallest setting.
function startSound(){
  const Context = window.AudioContext || window.webkitAudioContext; if (!Context) return;
  if (!soundContext) {
    for (const options of [{ sampleRate: 48000, latencyHint: "balanced" }, { latencyHint: "balanced" }, null]) {
      try { soundContext = options ? new Context(options) : new Context(); break; } catch (e) { soundContext = null; }
    }
  }
  if (soundContext) soundContext.resume().catch(() => {});
}
// The stream's time now heard from the speaker, or null while there is no sound.
function heardNow(){
  const c = soundContext;
  if (!c || snd.offset === null || c.state !== "running") return null;
  let t = c.currentTime - (c.outputLatency || c.baseLatency || 0);
  if (c.getOutputTimestamp) { const o = c.getOutputTimestamp(); if (o.contextTime > 0 && o.performanceTime > 0) t = o.contextTime + (performance.now() - o.performanceTime) / 1000; }
  return t - snd.offset;
}
// One message from the PC: "PBAU", its time (double), the sample rate (uint32), the channels (uint16), then 16-bit samples.
function isSound(data){ const b = new Uint8Array(data, 0, Math.min(4, data.byteLength)); return b.length === 4 && b[0] === 80 && b[1] === 66 && b[2] === 65 && b[3] === 85; }
function playSound(data){
  const c = soundContext; if (!c || c.state !== "running" || data.byteLength < 18) return;
  const head = new DataView(data), at = head.getFloat64(4, true), rate = head.getUint32(12, true), channels = head.getUint16(16, true);
  if (!rate || !channels) return;
  const samples = new Int16Array(data, 18, (data.byteLength - 18) >> 1), n = Math.floor(samples.length / channels);
  if (!n) return;
  const fs = c.sampleRate, length = n / rate, now = c.currentTime, s = snd;
  if (s.offset === null) {
    // Only once the phone's sound clock runs: while its output starts (a quarter of a second measured here) the clock stands still,
    // and all the sound sent meanwhile stayed as extra delay.
    if (s.clockAt === null || now === s.clockAt) { s.clockAt = now; return; }
    s.offset = now + s.margin - at; s.gap = true;
  }
  let when = at + s.offset;
  if (s.next !== null && !s.gap) {
    const drift = when - s.next;
    // Already played (the PS5 sent this stretch twice): left out. A little off: right after the last one. Far off: a real gap.
    if (drift < -JOIN) { s.resyncs++; return; }
    if (drift <= JOIN) { when = s.next; s.offset = when - at; } else { s.resyncs++; s.gap = true; }
  }
  when = Math.round(when * fs) / fs;
  let lead = when - now;
  // Far ahead: the stream's clock started again; play from here.
  if (lead > s.margin + 1) { s.offset = now + s.margin - at; when = Math.round((at + s.offset) * fs) / fs; lead = when - now; s.gap = true; s.resyncs++; }
  if (lead < 0.004) {
    // Too late to play: left out, and once for each hiccup the store grows (a short silence more now, fewer later).
    if (!s.lateRun) { s.lateRun = true; s.lates++; s.margin = Math.min(SAFE_MOST, s.margin + SAFE_GROW); s.offset += SAFE_GROW; }
    s.lostMs += length * 1000; s.lastLate = performance.now(); s.gap = true; return;
  }
  s.lateRun = false; s.minLead = Math.min(s.minLead, lead); s.shortLead = Math.min(s.shortLead, lead); s.frame = length;
  // Taking back extra store: the frames after one that faded out are left out (the next fades in), or one quiet frame at a time.
  let loudest = 0; for (let i = 0; i < samples.length; i++) { const v = samples[i] < 0 ? -samples[i] : samples[i]; if (v > loudest) loudest = v; }
  if (s.dropLeft > 0) { s.dropLeft--; s.offset -= length; s.trims++; s.gap = true; return; }
  if (s.takeBack > 0 && loudest < QUIET) { s.takeBack--; s.offset -= length; s.trims++; return; }
  // No quiet frame within 3 s, or much to take back: this one fades out over its last 4 ms and the rest is left out after it.
  const fadeOut = s.takeBack > 0 && !s.gap && (s.takeBack > 1 || performance.now() - s.takeSince > 3000);

function area(el, x, y, w, h){ el.style.left = Math.round(x) + "px"; el.style.top = Math.round(y) + "px"; el.style.width = Math.round(w) + "px"; el.style.height = Math.round(h) + "px"; el.style.bottom = "auto"; }
function cross(names, cx, cy, size, gap){

function layout(){

  const portrait = H > W, padOn = !$("pad").hidden, R = stickRadius();

  const sw = Math.max(52, 17 * u), sh = Math.max(32, 9 * u), smallW = Math.max(44, 10 * u), smallH = Math.max(32, 7 * u);

  bar.style.top = top + "px"; bar.style.left = (sideways ? left + sw + gap : left) + "px"; bar.style.right = (sideways ? W - right + sw + gap : W - right) + "px";
  const barBottom = bar.getBoundingClientRect().bottom;

    put(keys.R2, right - sw, top, sw, sh); put(keys.R1, right - sw, top + sh + gap, sw, sh);
    shouldersEnd = Math.max(top + 2 * sh + gap, barBottom);

  const row = [["L3", 1], ["PAD", 1.2], ["PS", 1], ["OPTIONS", 1.7], ["R3", 1]], rowY = bottom - smallH;
  const rowWidth = row.reduce((sum, [, wide]) => sum + wide * smallW, 0) + (row.length - 1) * gap;

addEventListener("resize", layout);
addEventListener("orientationchange", () => setTimeout(layout, 200));
document.addEventListener("fullscreenchange", () => setTimeout(layout, 100));
let controlsShown = !big;
$("controlsButton").setAttribute("aria-pressed", String(controlsShown));
$("controlsButton").addEventListener("click", () => { controlsShown = !controlsShown; $("controlsButton").setAttribute("aria-pressed", String(controlsShown)); $("pad").hidden = !mayPlay || !controlsShown; layout(); });
$("fullButton").addEventListener("click", async () => {
  const el = document.documentElement;
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (el.requestFullscreen) { await el.requestFullscreen({ navigationUI: "hide" }); if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {}); }

$("leaveButton").addEventListener("click", leave);
$("againButton").addEventListener("click", connectAgain);
// The sound needs a tap before a browser plays it.
$("startButton").addEventListener("click", () => {
  // Unmuted after the tap, as before, so the browser keeps the screen on while it plays (the picture has no sound of its own).
  started = true; $("overlay").hidden = true; video.muted = false; startSound(); video.play().catch(() => {});
  if (big) {
    keepBack(); document.querySelector(".bar").classList.add("away");
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
  }

// With a mouse, the bar comes back while it moves and steps aside again three seconds after.
let barTimer = null;
addEventListener("mousemove", () => {
  if (!big || !playing() || menuOpen) return;
  const bar = document.querySelector(".bar"); bar.classList.remove("away");
  clearTimeout(barTimer); barTimer = setTimeout(() => { if (!menuOpen && !bar.matches(":hover")) bar.classList.add("away"); }, 3000);
});
// Any pick in the menu closes it, so the keys go back to the PS5.
document.querySelectorAll(".bar button.chip").forEach(chip => chip.addEventListener("click", () => { if (menuOpen) closeMenu(); }));
// ---- More: your games, to start one on the PS5; the captures on the PC, to look at and save; and what PlayBridge noted. The lists and
// small pictures ask with the pairing token; a capture opens through a ticket the PC gives, as a video element cannot send a header.
let sheetTab = "games", sheetTurn = 0, logTimer = null, pictures = null, blobs = [], askYes = null, padNav = null;
function sheetSay(text, bad){ $("sheetNote").textContent = text || ""; $("sheetNote").className = "note" + (bad ? " bad" : ""); }
function trouble(e){ return e && e.message === "401" ? "This phone is no longer paired. Disconnect and pair it again with a new code." : "PlayBridge did not answer. Check that it is still open on the PC."; }
async function panelGet(path){
  const r = await fetch(path, { headers: { "X-Token": token }, cache: "no-store" });
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}
async function panelPost(path, body){
  const r = await fetch(path, { method: "POST", headers: { "X-Token": token, "Content-Type": "application/json" }, body: JSON.stringify(body), cache: "no-store" });
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}
// Pictures load as they scroll into view.
// An empty picture until then, so the grid shows its own background rather than a broken-image frame.
const NO_PICTURE = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
function lazyPicture(img, path){
  img.src = NO_PICTURE;
  if (!pictures) pictures = new IntersectionObserver(entries => {
    for (const entry of entries) if (entry.isIntersecting) { pictures.unobserve(entry.target); loadPicture(entry.target, entry.target.dataset.src); }
  }, { root: $("sheetList"), rootMargin: "300px" });
  img.dataset.src = path; pictures.observe(img);
}
async function loadPicture(img, path){
  const turn = sheetTurn;
  try {
    const r = await fetch(path, { headers: { "X-Token": token } });
    if (!r.ok || turn !== sheetTurn) return;
    const url = URL.createObjectURL(await r.blob()); blobs.push(url); img.src = url;
  } catch (e) {}
}
function dropPictures(){ if (pictures) pictures.disconnect(); pictures = null; blobs.forEach(url => URL.revokeObjectURL(url)); blobs = []; }
function bytesText(n){ return n >= 1073741824 ? (n / 1073741824).toFixed(1) + " GB" : n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
function askFirst(text, then){ $("askText").textContent = text; $("sheetAsk").hidden = false; askYes = then; $("askYes").focus(); }
function hideAsk(){ $("sheetAsk").hidden = true; askYes = null; }
function openSheet(){
  heldKeys.clear(); keysToPad(); clearTimeout(backHeld); $("sheet").hidden = false; send(true); watchPad(); showTab(sheetTab);
}
function closeSheet(){
  sheetTurn++; clearInterval(logTimer); dropPictures(); hideAsk(); $("sheetList").replaceChildren(); $("sheet").hidden = true; send(true);
  if (big) { document.querySelector(".bar").classList.add("away"); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
  else $("moreButton").focus();
}
async function showTab(tab){
  const turn = ++sheetTurn, list = $("sheetList");

  for (const [id, name] of [["tabGames", "games"], ["tabShots", "captures"], ["tabLog", "log"]]) $(id).setAttribute("aria-selected", String(name === tab));
  list.replaceChildren(); list.className = "list"; sheetSay("Loading…");

}
async function showGames(list, turn){
  const data = await panelGet("/api/games");
  if (turn !== sheetTurn) return;
  list.className = "list games";
  sheetSay(data.games.length ? "Choose a game to start it on your PS5." : "No games yet. They show once PlayBridge has read your PS5's library.");
  for (const game of data.games) {
    const item = document.createElement("button"), img = document.createElement("img"), name = document.createElement("span");
    item.type = "button"; item.className = "game" + (game.running ? " on" : ""); item.setAttribute("aria-label", game.name + (game.running ? ", open now" : ""));
    img.alt = ""; lazyPicture(img, "/api/icon/" + encodeURIComponent(game.id));
    name.className = "name"; name.textContent = game.name; item.append(img, name);
    if (game.running) { const open = document.createElement("span"); open.className = "open"; open.textContent = "Open now"; item.append(open); }
    item.addEventListener("click", () => startGame(game, false));
    list.append(item);
  }
}
async function startGame(game, change){
  hideAsk(); sheetSay("Starting " + game.name + "…");
  try {
    const answer = await panelPost("/api/start", { id: game.id, switch: change });
    if (answer.state === "ask") { sheetSay(""); askFirst(answer.text, () => startGame(game, true)); return; }
    sheetSay(answer.text, answer.state === "problem");
    // Once it starts, the sheet steps aside so the game shows.
    if (answer.state !== "problem") { const turn = sheetTurn; setTimeout(() => { if (turn === sheetTurn && !$("sheet").hidden) closeSheet(); }, 1500); }
  } catch (e) { sheetSay(trouble(e), true); }
}
async function showCaptures(list, turn){
  const data = await panelGet("/api/captures");
  if (turn !== sheetTurn) return;
  list.className = "list shots";
  sheetSay(data.captures.length ? "Screenshots and recordings on the PC, newest first." : "No captures yet. Screenshots and recordings made in PlayBridge show here.");
  for (const shot of data.captures) {
    const item = document.createElement("button"), img = document.createElement("img"), when = document.createElement("span");
    const video = shot.kind === "Videos";
    item.type = "button"; item.className = "shot"; item.setAttribute("aria-label", (video ? "Recording, " : "Photo, ") + shot.when + ", " + bytesText(shot.size));

    when.className = "when"; when.textContent = shot.when + " · " + bytesText(shot.size);
    if (video) { const badge = document.createElement("span"); badge.className = "badge"; badge.textContent = "Video"; when.prepend(badge); }
    item.append(img, when); item.addEventListener("click", () => openCapture(shot));

}
async function openCapture(shot){
  sheetSay("Opening…");
  try {
    const answer = await panelPost("/api/ticket", { id: shot.id }), body = $("viewerBody");
    sheetSay("");
    let shown;
    if (shot.kind === "Videos") { shown = document.createElement("video"); shown.controls = true; shown.playsInline = true; shown.preload = "metadata"; }
    else { shown = document.createElement("img"); shown.alt = shot.name; }
    shown.src = answer.url; body.replaceChildren(shown);
    $("viewerName").textContent = shot.name + " · " + bytesText(shot.size);
    $("viewerSave").href = answer.url + "?save=1"; $("viewerSave").setAttribute("download", shot.name);
    $("viewer").hidden = false; $("viewerClose").focus();
  } catch (e) { sheetSay(e && e.message === "404" ? "That capture is no longer on the PC. Open Captures again." : trouble(e), true); }
}
function closeViewer(){
  const video = $("viewerBody").querySelector("video");
  if (video) { video.pause(); video.removeAttribute("src"); video.load(); }
  $("viewerBody").replaceChildren(); $("viewer").hidden = true;
  const back = $("sheetList").querySelector("button"); if (big && back) back.focus();
}
async function showLog(list, turn){
  const data = await panelGet("/api/log");
  if (turn !== sheetTurn) return;
  list.className = "list log";
  const atEnd = list.scrollTop + list.clientHeight >= list.scrollHeight - 8;
  list.textContent = data.lines.length ? data.lines.join("\n") : "Nothing yet.";
  if (atEnd) list.scrollTop = list.scrollHeight;
  sheetSay("What PlayBridge noted in this session, newest last.");
}
// On a big screen, the arrows move to the nearest choice that way; Back closes.
function nearest(from, way){
  const box = !$("viewer").hidden ? $("viewer") : $("sheet");
  const items = Array.from(box.querySelectorAll("button,a.chip")).filter(el => !el.hidden && el.offsetParent !== null);
  if (!items.includes(from)) return items[0];
  const a = from.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, score = Infinity;
  for (const el of items) {
    if (el === from) continue;
    const b = el.getBoundingClientRect(), dx = b.left + b.width / 2 - ax, dy = b.top + b.height / 2 - ay;
    const along = way === "ArrowLeft" ? -dx : way === "ArrowRight" ? dx : way === "ArrowUp" ? -dy : dy;
    const across = way === "ArrowLeft" || way === "ArrowRight" ? Math.abs(dy) : Math.abs(dx);
    if (along > 1 && along + across * 2 < score) { score = along + across * 2; best = el; }
  }
  return best;
}
function sheetKey(name){
  if (BACK.has(name)) { if (!$("viewer").hidden) closeViewer(); else if (!$("sheetAsk").hidden) hideAsk(); else closeSheet(); return true; }
  if (name === "Enter" && document.activeElement && document.activeElement !== document.body && !document.activeElement.matches("video")) { document.activeElement.click(); return true; }
  if (!name.startsWith("Arrow") || !big) return false;
  const next = nearest(document.activeElement, name);
  if (next) { next.focus(); next.scrollIntoView({ block: "nearest" }); }
  return true;
}
document.addEventListener("keydown", ev => {
  if (!covered()) return;
  const name = keyName(ev);
  if ((BACK.has(name) || name.startsWith("Arrow") && big) && sheetKey(name)) ev.preventDefault();
});
// A controller moves through the sheet too: the D-pad or left stick, ✕ to choose, ○ to go back.
function watchPad(){
  if (padNav || !navigator.getGamepads) return;
  let was = new Set();
  padNav = setInterval(() => {
    if (!covered()) { clearInterval(padNav); padNav = null; return; }
    const pad = Array.from(navigator.getGamepads()).find(Boolean), down = new Set();
    if (!pad) return;
    pad.buttons.forEach((button, i) => { if (button.pressed) down.add(i); });
    const x = pad.axes[0] || 0, y = pad.axes[1] || 0;
    if (x < -.6) down.add(14); if (x > .6) down.add(15); if (y < -.6) down.add(12); if (y > .6) down.add(13);
    const names = { 0: "Enter", 1: "Escape", 12: "ArrowUp", 13: "ArrowDown", 14: "ArrowLeft", 15: "ArrowRight" };
    for (const i of down) if (!was.has(i) && names[i]) { if (names[i].startsWith("Arrow") && !big) continue; sheetKey(names[i]); }
    was = down;
  }, 50);
}
$("moreButton").addEventListener("click", openSheet);
$("sheetClose").addEventListener("click", closeSheet);
$("tabGames").addEventListener("click", () => showTab("games"));
$("tabShots").addEventListener("click", () => showTab("captures"));
$("tabLog").addEventListener("click", () => showTab("log"));
$("askYes").addEventListener("click", () => { const then = askYes; hideAsk(); if (then) then(); });

$("viewerClose").addEventListener("click", closeViewer);
$("sheet").addEventListener("click", ev => { if (ev.target === $("sheet")) closeSheet(); });

}
