<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayBridge overlay</title>
<style>
/* PlayBridge's overlay for an OBS Browser source, 1920 x 1080 with a clear background. Everything on it comes from PlayBridge on this
   PC, asked twice a second. Options after the address: ?chat=1 adds the Twitch chat, game=0, trophy=0 and timer=0 leave a part out,
   and scale=1.5 makes it all larger. */
:root {
  --scale: 1;
  --glass: rgba(12, 12, 16, 0.66);
  --edge: rgba(255, 255, 255, 0.12);
  --gold: #ebd48e;
  --gold-deep: #d4af37;
  --text: #ffffff;
  --soft: #c8c8cd;
  --dim: rgba(255, 255, 255, 0.55);
  --red: #ff4b4b;
  --green: #6edc8c;
  --face: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
body { font-family: var(--face); color: var(--text); }
.stage { position: absolute; inset: 0; transform: scale(var(--scale)); transform-origin: 0 0; width: calc(100% / var(--scale)); height: calc(100% / var(--scale)); }
.glass {
  background: var(--glass);
  border: 1px solid var(--edge);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(18px) saturate(140%);
  border-radius: 22px;
}
.hidden { opacity: 0 !important; pointer-events: none; }

/* Now playing, bottom left. */
#game {
  position: absolute; left: 48px; bottom: 48px; min-width: 420px; max-width: 760px; padding: 20px 26px 20px 26px;
  transition: opacity 600ms ease, transform 600ms cubic-bezier(.2, .9, .2, 1);
}
#game.hidden { transform: translateY(24px); }
#game::before {
  content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 4px; border-radius: 4px;
  background: linear-gradient(var(--gold), var(--gold-deep));
}
.kicker { font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
#name { font-size: 34px; font-weight: 600; line-height: 1.15; margin: 4px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#since { font-size: 16px; color: var(--soft); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 17px;
  background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.10);
  font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip .big { font-size: 19px; }
.chip .small { color: var(--soft); font-weight: 500; }
.chip.rec { background: rgba(255, 75, 75, 0.16); border-color: rgba(255, 75, 75, 0.45); }
.chip.live { background: var(--red); border-color: var(--red); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); animation: pulse 1.4s ease-in-out infinite; }
.chip.live .dot { background: #fff; box-shadow: 0 0 8px #fff; }
@keyframes pulse { 50% { opacity: 0.35; } }

/* A trophy as it unlocks, top centre. */
#trophy {
  position: absolute; top: 44px; left: 50%; width: 560px; margin-left: -280px; padding: 16px 22px 16px 16px;
  display: flex; align-items: center; gap: 18px; border-radius: 48px; overflow: hidden;
  transition: opacity 500ms ease, transform 700ms cubic-bezier(.2, 1.2, .3, 1);
}
#trophy.hidden { transform: translateY(-140%); }
#trophy::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 120px; left: -160px;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.22), transparent);
}
#trophy.shine::after { animation: shine 1.6s ease 400ms 1; }
@keyframes shine { to { left: 640px; } }
.medal {
  flex: none; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #fff8, transparent 60%), var(--grade, var(--gold-deep));
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18), 0 0 26px var(--grade, var(--gold-deep));
  overflow: hidden;
}
.medal img { width: 100%; height: 100%; object-fit: cover; }
.medal svg { width: 34px; height: 34px; fill: rgba(0, 0, 0, 0.55); }
#trophyKicker { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: var(--grade, var(--gold)); }
#trophyName { font-size: 24px; font-weight: 600; line-height: 1.2; margin-top: 2px; }
#trophyGame { font-size: 14px; color: var(--soft); margin-top: 2px; }

/* The speedrun timer, top right. */
#timer { position: absolute; top: 44px; right: 48px; min-width: 300px; padding: 16px 24px; text-align: right; transition: opacity 400ms ease; }
#timerTime { font-size: 54px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.05; letter-spacing: -0.01em; }
#timerTime.idle { color: var(--dim); }
#timerSplit { font-size: 16px; color: var(--soft); margin-top: 4px; font-variant-numeric: tabular-nums; }
#timerDelta.ahead { color: var(--green); }
#timerDelta.behind { color: var(--red); }

/* Twitch chat, right side. */
#chat { position: absolute; right: 48px; bottom: 48px; width: 400px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; max-height: 620px; overflow: hidden; }
.line {
  padding: 10px 14px; border-radius: 16px; font-size: 17px; line-height: 1.35; overflow-wrap: anywhere;
  animation: rise 380ms cubic-bezier(.2, .9, .2, 1);
  transition: opacity 900ms ease;
}
.line.event { color: var(--gold); }
.line .who { font-weight: 700; }
.line .badge { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 2px; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
</style>
</head>
<body>
<div class="stage">
  <section id="game" class="glass hidden" aria-live="polite">
    <div class="kicker">Now playing</div>
    <div id="name"></div>
    <div id="since"></div>
    <div class="chips" id="chips"></div>
  </section>
  <section id="trophy" class="glass hidden" aria-live="assertive">
    <div class="medal" id="medal"></div>
    <div>
      <div id="trophyKicker">Trophy unlocked</div>
      <div id="trophyName"></div>
      <div id="trophyGame"></div>
    </div>
  </section>
  <section id="timer" class="glass hidden">
    <div id="timerTime"></div>
    <div id="timerSplit"><span id="timerSplitText"></span> <span id="timerDelta"></span></div>
  </section>
  <section id="chat"></section>
</div>
<script>
"use strict";
const query = new URLSearchParams(location.search);
const want = { game: query.get("game") !== "0", trophy: query.get("trophy") !== "0", timer: query.get("timer") !== "0", chat: query.get("chat") === "1" };
const scale = Math.min(3, Math.max(0.5, parseFloat(query.get("scale")) || 1));
document.documentElement.style.setProperty("--scale", scale);
const $ = (id) => document.getElementById(id);
const GRADES = { platinum: "#bed7eb", gold: "#ebbe3c", silver: "#c8c8d2", bronze: "#cd8246" };
const NAME_COLOURS = ["#FF0000", "#0000FF", "#008000", "#B22222", "#FF7F50", "#9ACD32", "#FF4500", "#2E8B57", "#DAA520", "#D2691E", "#5F9EA0", "#1E90FF", "#FF69B4", "#8A2BE2", "#00FF7F"];
const BADGES = { broadcaster: "#eb4040", moderator: "#28c85a", vip: "#ec48c8", subscriber: "#a06eff" };
let offset = 0, shownTrophy = null, trophyTimer = 0, last = null;

function clock(seconds) {
  seconds = Math.max(0, Math.floor(seconds));
  const h = Math.floor(seconds / 3600), m = Math.floor(seconds / 60) % 60, s = seconds % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
}
function now() { return Date.now() / 1000 + offset; }
// A name's colour made light enough to read, as PlayBridge does over the game.
function readable(colour, name) {
  if (!/^#[0-9a-f]{6}$/i.test(colour || "")) { let sum = 0; for (const c of new TextEncoder().encode(name)) sum += c; colour = NAME_COLOURS[sum % NAME_COLOURS.length]; }
  let r = parseInt(colour.slice(1, 3), 16) / 255, g = parseInt(colour.slice(3, 5), 16) / 255, b = parseInt(colour.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b); let h = 0, s = 0, l = (max + min) / 2;
  if (max !== min) { const d = max - min; s = l > 0.5 ? d / (2 - max - min) : d / (max + min); h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6; }
  return "hsl(" + Math.round(h * 360) + "," + Math.round(Math.min(s, 0.85) * 100) + "%," + Math.round(Math.max(l, 0.66) * 100) + "%)";
}
function chip(className, parts) {
  const element = document.createElement("span"); element.className = "chip " + className;
  for (const [kind, text] of parts) {
    const piece = document.createElement("span");
    if (kind === "dot") piece.className = "dot"; else { piece.className = kind; piece.textContent = text; }
    element.appendChild(piece);
  }
  return element;
}
function showGame(status) {
  const box = $("game"), game = status.game;
  if (!want.game || !game) { box.classList.add("hidden"); return; }
  $("name").textContent = game.name;
  $("since").textContent = "Playing on PS5 · " + clock(now() - game.since);
  const chips = [];
  if (status.fps != null) chips.push(chip("", [["big", Math.round(status.fps)], ["small", "FPS"]]));
  const heat = [status.cpu != null ? "CPU " + status.cpu + "°" : "", status.soc != null ? "SoC " + status.soc + "°" : ""].filter(Boolean).join("  ·  ");
  if (heat) chips.push(chip("", [["small", heat]]));
  if (status.watts != null) chips.push(chip("", [["small", Math.round(status.watts) + " W"]]));
  if (status.recording) chips.push(chip("rec", [["dot"], ["", "REC" + (status.recordingSeconds != null ? "  " + clock(status.recordingSeconds) : "")]]));
  if (status.live && status.live.state === "live") chips.push(chip("live", [["dot"], ["", "LIVE  " + clock(status.live.seconds)]]));
  if (status.mic) chips.push(chip("", [["small", "Mic on"]]));
  $("chips").replaceChildren(...chips);
  box.classList.remove("hidden");
}
function showTrophy(status) {
  const trophy = status.trophy;
  if (!want.trophy || !trophy || trophy.count === shownTrophy) return;
  const first = shownTrophy === null; shownTrophy = trophy.count;
  // A trophy from before the page opened is not shown again.
  if (first && now() - trophy.at > 8) return;
  const box = $("trophy"), grade = GRADES[trophy.grade] || GRADES.gold;
  box.style.setProperty("--grade", grade);
  $("trophyKicker").textContent = (trophy.grade ? trophy.grade + " trophy" : "Trophy") + " unlocked";
  $("trophyName").textContent = trophy.name || "A new trophy";
  $("trophyGame").textContent = trophy.game || "";
  const medal = $("medal"); medal.replaceChildren();
  if (trophy.picture) { const img = new Image(); img.alt = ""; img.src = "trophy.png?n=" + trophy.count; medal.appendChild(img); }
  else medal.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v3a4 4 0 0 1-3 3.87V13a3 3 0 0 1-2 2.83V18h3v3H8v-3h3v-2.17A3 3 0 0 1 9 13V9.87A4 4 0 0 1 6 6zM3 4h2v2a3 3 0 0 0 1 2.24V10A5 5 0 0 1 3 6zm16 0h2v2a5 5 0 0 1-3 4V8.24A3 3 0 0 0 19 6z"/></svg>';
  box.classList.remove("shine"); void box.offsetWidth; box.classList.add("shine");
  box.classList.remove("hidden"); clearTimeout(trophyTimer);
  trophyTimer = setTimeout(() => box.classList.add("hidden"), 7000);
}
function showTimer(status) {
  const box = $("timer"), timer = status.timer;
  if (!want.timer || !timer) { box.classList.add("hidden"); return; }
  const time = $("timerTime"); time.textContent = timer.time; time.className = timer.state === "idle" ? "idle" : "";
  $("timerSplitText").textContent = timer.split || timer.name || "";
  const delta = $("timerDelta"); delta.textContent = timer.delta || ""; delta.className = timer.delta ? (timer.ahead ? "ahead" : "behind") : "";
  box.classList.remove("hidden");
}
function showChat(status) {
  const box = $("chat"), chat = status.chat;
  if (!want.chat || !chat) { box.replaceChildren(); return; }
  const kept = new Map([...box.children].map((element) => [element.dataset.id, element]));
  const lines = chat.messages.map((message) => {
    const id = message.id || message.at + message.name;
    let line = kept.get(id);
    if (!line) {
      line = document.createElement("div"); line.className = "line glass" + (message.kind === "event" ? " event" : ""); line.dataset.id = id;
      if (message.kind !== "event") {
        for (const badge of message.badges || []) { const dot = document.createElement("span"); dot.className = "badge"; dot.style.background = BADGES[badge] || "#fff"; line.appendChild(dot); }
        const who = document.createElement("span"); who.className = "who"; who.style.color = readable(message.colour, message.name); who.textContent = message.name; line.appendChild(who);
        line.appendChild(document.createTextNode(message.kind === "action" ? " " : ": "));
      }
      const words = document.createElement("span"); words.textContent = message.text;
      if (message.kind === "action") words.style.color = readable(message.colour, message.name);
      line.appendChild(words);
    }
    return line;
  });
  box.replaceChildren(...lines);
}
async function poll() {
  try {
    const answer = await fetch("status", { cache: "no-store" });
    if (!answer.ok) throw new Error(answer.status);
    const status = await answer.json(); offset = status.now - Date.now() / 1000; last = status;
    document.body.classList.remove("hidden");
    showGame(status); showTrophy(status); showTimer(status); showChat(status);
  } catch (error) {
    // PlayBridge is closed or local control is off: nothing shows until it answers again.
    for (const id of ["game", "timer"]) $(id).classList.add("hidden");
    $("chat").replaceChildren();
  }
}
poll(); setInterval(poll, 500);
// The play time and the live clock move every second between answers.
setInterval(() => { if (last) showGame(last); }, 1000);
</script>
</body>
</html>
